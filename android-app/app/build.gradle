apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

// Load local properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

android {
    namespace "com.signalapp"
    compileSdk 34

    defaultConfig {
        applicationId "com.signalapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Build config fields
        // SUPABASE_URL is hardcoded below (public info, safe to embed)
        buildConfigField "String", "SUPABASE_URL", "\"https://pgipjbsekpwzrjxjytxv.supabase.co\""

        // SUPABASE_KEY is NOT embedded in APK - must be entered by user or decrypted from encrypted form
        // RSA Private key for key encryption (from GitHub secrets or local.properties)
        def privateKeyEnv = System.getenv("RSA_PRIVATE_KEY") ?: localProperties.getProperty('RSA_PRIVATE_KEY', '')
        // Escape actual newlines for Java string literal
        def escapedKey = privateKeyEnv.replace("\r", "").replace("\n", "\\n")
        buildConfigField "String", "RSA_PRIVATE_KEY", "\"${escapedKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Rename APK output
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "StatusPulse.apk"
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.zxing:core:3.5.1'
    testImplementation 'junit:junit:4.13.2'
}
