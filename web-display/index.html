<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Lights</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; background: #000; font-family: sans-serif; overflow: hidden; }

        .screen { display: none; width: 100%; height: 100%; justify-content: center; align-items: center; flex-direction: column; }
        .screen.active { display: flex; }

        /* Session Selection */
        #sessionSelect { background: #1a1a1a; }
        .session-list { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 500px; }
        .session-item { background: #2a2a2a; color: #fff; padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; border: 1px solid #444; }
        .session-item:hover { background: #3a3a3a; border-color: #0f0; }
        .no-sessions { color: #888; }

        /* Light Display */
        #lightDisplay { background: #000; flex-direction: column; gap: 40px; }
        .title { color: #fff; font-size: 24px; margin-bottom: 20px; }
        .lights { display: flex; gap: 30px; }
        .light { width: 100px; height: 100px; border-radius: 50%; background: #222; transition: background 0.3s; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .light.red { background: #ff4444; box-shadow: 0 0 30px #ff0000; }
        .light.yellow { background: #ffff00; box-shadow: 0 0 30px #ffff00; }
        .light.green { background: #00ff00; box-shadow: 0 0 30px #00ff00; }

        .back-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background: #333; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        .back-btn:hover { background: #444; }

        .status { position: absolute; top: 20px; right: 20px; padding: 8px 15px; background: #333; color: #0f0; border-radius: 4px; font-size: 12px; }
        .status.disconnected { color: #f00; }
    </style>
</head>
<body>
    <div class="screen active" id="sessionSelect">
        <h1 style="color: #fff; margin-bottom: 30px;">Select Session</h1>
        <div class="session-list" id="sessionList"></div>
        <div class="no-sessions" id="noSessions">No active sessions</div>
    </div>

    <div class="screen" id="lightDisplay">
        <button class="back-btn" onclick="goBack()">← Back</button>
        <div class="status" id="realtimeStatus">Connecting...</div>
        <div class="title" id="sessionTitle"></div>
        <div class="lights">
            <div class="light" id="redLight"></div>
            <div class="light" id="yellowLight"></div>
            <div class="light" id="greenLight"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pgipjbsekpwzrjxjytxv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9sD73_OSr4EgV9UFslJykA_bRBS5Kgr';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSessionId = null;
        let signalChannel = null;

        async function showSessions() {
            try {
                const { data } = await db.from('sessions').select('*').eq('status', 'active');
                const list = document.getElementById('sessionList');
                const noSessions = document.getElementById('noSessions');

                list.innerHTML = '';
                if (!data || data.length === 0) {
                    noSessions.style.display = 'block';
                    return;
                }

                noSessions.style.display = 'none';
                data.forEach(session => {
                    const div = document.createElement('div');
                    div.className = 'session-item';
                    div.textContent = session.title;
                    div.onclick = () => selectSession(session.id, session.title);
                    list.appendChild(div);
                });
            } catch (err) {
                console.error('Error loading sessions:', err);
            }
        }

        async function selectSession(sessionId, title) {
            currentSessionId = sessionId;
            document.getElementById('sessionTitle').textContent = title;
            document.getElementById('sessionSelect').classList.remove('active');
            document.getElementById('lightDisplay').classList.add('active');

            updateRealtimeStatus('Connecting...');

            // Fetch initial state
            await checkSignal();

            // Subscribe to realtime changes
            subscribeToSignalChanges();
        }

        async function checkSignal() {
            try {
                const { data } = await db.from('signals').select('color').eq('session_id', currentSessionId).single();
                if (data) {
                    updateLights(data.color);
                }
            } catch (err) {
                console.error('Error fetching signal:', err);
            }
        }

        function subscribeToSignalChanges() {
            // Unsubscribe from previous channel if it exists
            if (signalChannel) {
                signalChannel.unsubscribe();
            }

            // Create new subscription
            signalChannel = db.channel(`signals-${currentSessionId}`)
                .on(
                    'postgres_changes',
                    {
                        event: '*',
                        schema: 'public',
                        table: 'signals',
                        filter: `session_id=eq.${currentSessionId}`
                    },
                    (payload) => {
                        console.log('Signal change:', payload);
                        if (payload.new && payload.new.color) {
                            updateLights(payload.new.color);
                        }
                    }
                )
                .subscribe((status) => {
                    console.log('Subscription status:', status);
                    if (status === 'SUBSCRIBED') {
                        updateRealtimeStatus('Connected');
                    } else if (status === 'CLOSED') {
                        updateRealtimeStatus('Disconnected');
                    } else if (status === 'CHANNEL_ERROR') {
                        updateRealtimeStatus('Error');
                    }
                });
        }

        function updateRealtimeStatus(status) {
            const el = document.getElementById('realtimeStatus');
            el.textContent = status;
            el.classList.toggle('disconnected', status !== 'Connected');
        }

        function updateLights(color) {
            document.getElementById('redLight').classList.toggle('red', color === 'red');
            document.getElementById('yellowLight').classList.toggle('yellow', color === 'yellow');
            document.getElementById('greenLight').classList.toggle('green', color === 'green');
        }

        function goBack() {
            // Unsubscribe from realtime
            if (signalChannel) {
                signalChannel.unsubscribe();
                signalChannel = null;
            }

            currentSessionId = null;
            document.getElementById('lightDisplay').classList.remove('active');
            document.getElementById('sessionSelect').classList.add('active');
            showSessions();
        }

        showSessions();
    </script>
</body>
</html>
