<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Lights Display</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a237e' width='100' height='100' rx='12'/><circle cx='50' cy='25' r='15' fill='%23ff6b6b'/><circle cx='50' cy='50' r='15' fill='%23ffeb3b'/><circle cx='50' cy='75' r='15' fill='%234caf50'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ============================================
           SESSION SELECTION SCREEN
           ============================================ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
        }

        .screen.active {
            display: flex;
        }

        #sessionSelect {
            background-color: #000000;
        }

        .session-title {
            color: #00ff00;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .session-item {
            background-color: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .session-item:hover {
            background-color: #2a2a2a;
            border-color: #00ff00;
            transform: translateY(-5px);
        }

        .session-item-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .session-item-info {
            color: #888888;
            font-size: 12px;
        }

        .no-sessions {
            color: #888888;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }

        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .status.connected {
            color: rgba(0, 255, 0, 0.7);
        }

        .status.disconnected {
            color: rgba(255, 100, 100, 0.7);
        }

        /* ============================================
           LIGHT DISPLAY SCREEN
           ============================================ */
        #lightDisplay {
            background-color: #000000;
            justify-content: space-around;
            flex-direction: column;
        }

        .header {
            text-align: center;
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #sessionName {
            width: 100%;
            padding-top: 10px;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #555555;
        }

        .lights-container {
            display: flex;
            gap: 120px;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .light {
            width: 600px;
            height: 600px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 14px;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            will-change: filter;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .light.red {
            background-color: transparent;
        }

        /* Off state - green, circle invisible */
        .light.red.off {
            opacity: 0.1;
            filter: none;
        }

        /* White state - yellow alert, blue circle with blue glow */
        .light.red.white {
            opacity: 1;
            filter: drop-shadow(0 0 60px rgba(33, 150, 243, 1)) drop-shadow(0 0 120px rgba(33, 150, 243, 0.8)) drop-shadow(0 0 180px rgba(33, 150, 243, 0.5));
        }

        /* Alert state - red, red circle with no glow */
        .light.red.alert {
            opacity: 1;
            filter: none;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Session Selection Screen -->
        <div class="screen active" id="sessionSelect">
            <div class="session-title">Select Session</div>
            <div class="session-list" id="sessionList">
                <div class="no-sessions" id="noSessions">Loading sessions...</div>
            </div>

            <div class="status disconnected" id="status">Connecting...</div>
        </div>

        <!-- Light Display Screen -->
        <div class="screen" id="lightDisplay">
            <div class="header">
                <button class="back-btn" onclick="goBack()">← Back</button>
                <div id="sessionName">Session Name</div>
            </div>
            <div class="lights-container">
                <div class="light red" id="redLight">
                    <svg viewBox="0 0 100 100" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10 C72.9 10 91 28.1 91 51 C91 73.9 72.9 92 50 92 C27.1 92 9 73.9 9 51 C9 28.1 27.1 10 50 10 Z" fill="white" stroke="white" stroke-width="6"/>
                        <rect x="46" y="25" width="8" height="40" rx="2" fill="#000000"/>
                        <circle cx="50" cy="70" r="5" fill="#000000"/>
                    </svg>
                </div>
            </div>
            <div class="footer">
                <div id="footer-info">Connected to session</div>
                <div id="realtime-status" style="margin-top: 10px; font-size: 11px; color: #888;">Realtime: Connected</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pgipjbsekpwzrjxjytxv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9sD73_OSr4EgV9UFslJykA_bRBS5Kgr';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSessionId = null;
        let signalChannel = null;

        async function showSessions() {
            try {
                const { data } = await db.from('sessions').select('*').eq('status', 'active');
                const list = document.getElementById('sessionList');
                const noSessions = document.getElementById('noSessions');
                const status = document.getElementById('status');

                // Update status to connected
                status.textContent = 'Connected';
                status.className = 'status connected';

                // Remove only session items, not the noSessions element
                const items = list.querySelectorAll('.session-item');
                items.forEach(item => item.remove());

                if (!data || data.length === 0) {
                    noSessions.style.display = 'block';
                    return;
                }

                noSessions.style.display = 'none';
                data.forEach(session => {
                    const div = document.createElement('div');
                    div.className = 'session-item';
                    const title = document.createElement('div');
                    title.className = 'session-item-title';
                    title.textContent = session.title;
                    const info = document.createElement('div');
                    info.className = 'session-item-info';
                    info.textContent = `Created: ${new Date(session.created_at).toLocaleString()}`;
                    div.appendChild(title);
                    div.appendChild(info);
                    div.onclick = () => selectSession(session.id, session.title);
                    list.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading sessions:', error);
                const status = document.getElementById('status');
                status.textContent = 'Connection Failed';
                status.className = 'status disconnected';
            }
        }

        async function selectSession(sessionId, title) {
            currentSessionId = sessionId;
            document.getElementById('sessionName').textContent = title;
            document.getElementById('sessionSelect').classList.remove('active');
            document.getElementById('lightDisplay').classList.add('active');

            if (signalChannel) {
                signalChannel.unsubscribe();
            }

            await loadInitialSignal();
            subscribeToSignalChanges();
        }

        async function loadInitialSignal() {
            const { data } = await db.from('signals').select('color').eq('session_id', currentSessionId).single();
            if (data) {
                updateLights(data.color);
            }
        }

        function subscribeToSignalChanges() {
            signalChannel = db.channel(`signals-${currentSessionId}`)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'signals',
                    filter: `session_id=eq.${currentSessionId}`
                }, (payload) => {
                    updateLights(payload.new.color);
                })
                .subscribe();
        }

        function updateLights(color) {
            const redLight = document.getElementById('redLight');
            const svgPath = redLight.querySelector('path');

            // Reset all states
            redLight.classList.remove('off', 'white', 'alert');

            // Change circle color and glow based on status
            if (color === 'green') {
                // Off state - circle invisible
                redLight.classList.add('off');
                svgPath.setAttribute('fill', 'white');
                svgPath.setAttribute('stroke', 'white');
            } else if (color === 'yellow') {
                // White state - blue circle with glow (information advisory)
                redLight.classList.add('white');
                svgPath.setAttribute('fill', '#2196F3');
                svgPath.setAttribute('stroke', '#2196F3');
            } else if (color === 'red') {
                // Alert state - red circle with no glow
                redLight.classList.add('alert');
                svgPath.setAttribute('fill', '#ff0000');
                svgPath.setAttribute('stroke', '#ff0000');
            }
        }

        function goBack() {
            if (signalChannel) {
                signalChannel.unsubscribe();
                signalChannel = null;
            }
            currentSessionId = null;
            document.getElementById('lightDisplay').classList.remove('active');
            document.getElementById('sessionSelect').classList.add('active');
            showSessions();
        }

        showSessions();
    </script>
</body>
</html>
