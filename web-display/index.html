<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Lights Display</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a237e' width='100' height='100' rx='12'/><circle cx='50' cy='25' r='15' fill='%23ff6b6b'/><circle cx='50' cy='50' r='15' fill='%23ffeb3b'/><circle cx='50' cy='75' r='15' fill='%234caf50'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ============================================
           SESSION SELECTION SCREEN
           ============================================ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
        }

        .screen.active {
            display: flex;
        }

        #sessionSelectScreen {
            background-color: #000000;
        }

        .session-title {
            color: #00ff00;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }

        .session-item {
            background-color: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .session-item:hover {
            background-color: #2a2a2a;
            border-color: #00ff00;
            transform: translateY(-5px);
        }

        .session-item-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .session-item-info {
            color: #888888;
            font-size: 12px;
        }

        .no-sessions {
            color: #888888;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }

        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .status.connected {
            color: rgba(0, 255, 0, 0.7);
        }

        .status.disconnected {
            color: rgba(255, 100, 100, 0.7);
        }

        /* ============================================
           LIGHT DISPLAY SCREEN
           ============================================ */
        #lightDisplayScreen {
            background-color: #000000;
            justify-content: space-around;
            flex-direction: column;
        }

        .header {
            text-align: center;
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .back-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #555555;
        }

        .lights-container {
            display: flex;
            gap: 60px;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .light {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .light.red {
            background-color: #ff0000;
            opacity: 0.3;
        }

        .light.red.active {
            opacity: 1;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .light.yellow {
            background-color: #ffff00;
            opacity: 0.3;
        }

        .light.yellow.active {
            opacity: 1;
            box-shadow: 0 0 50px rgba(255, 255, 0, 0.8), inset 0 0 20px rgba(255, 255, 0, 0.4);
            color: rgba(0, 0, 0, 0.7);
        }

        .light.green {
            background-color: #00ff00;
            opacity: 0.3;
        }

        .light.green.active {
            opacity: 1;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.8), inset 0 0 20px rgba(0, 255, 0, 0.4);
            color: rgba(0, 0, 0, 0.7);
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Session Selection Screen -->
        <div class="screen active" id="sessionSelectScreen">
            <div class="session-title">Select Session</div>
            <div class="session-list" id="sessionList">
                <div class="no-sessions">Loading sessions...</div>
            </div>

            <div class="status disconnected" id="status">Connecting...</div>
        </div>

        <!-- Light Display Screen -->
        <div class="screen" id="lightDisplayScreen">
            <div class="header">
                <button class="back-btn" onclick="goBackToSessions()">← Back</button>
                <div id="sessionName">Session Name</div>
                <div style="width: 120px;"></div>
            </div>
            <div class="lights-container">
                <div class="light red" id="light-red">RED</div>
                <div class="light yellow" id="light-yellow">YELLOW</div>
                <div class="light green active" id="light-green">GREEN</div>
            </div>
            <div class="footer">
                <div id="footer-info">Connected to session</div>
                <div id="realtime-status" style="margin-top: 10px; font-size: 11px; color: #888;">Realtime: Connecting...</div>
            </div>
        </div>
    </div>
</body>
</html>
