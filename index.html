<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatusPulse - Real-time Feedback Display</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a237e' width='100' height='100' rx='12'/><circle cx='50' cy='25' r='15' fill='%23ff6b6b'/><circle cx='50' cy='50' r='15' fill='%23ffeb3b'/><circle cx='50' cy='75' r='15' fill='%234caf50'/></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ============================================
           SESSION SELECTION SCREEN
           ============================================ */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 40px;
        }

        .screen.active {
            display: flex;
        }

        #sessionSelect {
            background-color: #000000;
            position: relative;
        }

        .session-title {
            color: #00ff00;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }

        .session-subtitle {
            color: #888888;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 40px;
            text-align: center;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            overflow-y: auto;
            max-height: 70vh;
            position: relative;
            z-index: 10;
        }

        /* Scrollbar styling for better visibility */
        .session-list::-webkit-scrollbar {
            width: 8px;
        }

        .session-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .session-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .session-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .session-item {
            background-color: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .session-item:hover {
            background-color: #2a2a2a;
            border-color: #00ff00;
            transform: translateY(-5px);
        }

        .session-item-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .session-item-info {
            color: #888888;
            font-size: 12px;
        }

        .no-sessions {
            color: #888888;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }

        .download-section {
            margin-top: 40px;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        .download-divider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .download-divider::before,
        .download-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #333333;
        }

        .download-divider span {
            color: #666666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #1a1a1a;
            border: 2px solid #00ff00;
            border-radius: 12px;
            padding: 15px 30px;
            color: #00ff00;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background-color: #00ff00;
            color: #000000;
            transform: translateY(-3px);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
        }

        .download-info {
            color: #666666;
            font-size: 12px;
            margin-top: 10px;
        }

        .status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .status.connected {
            color: rgba(0, 255, 0, 0.7);
        }

        .status.disconnected {
            color: rgba(255, 100, 100, 0.7);
        }

        /* ============================================
           LIGHT DISPLAY SCREEN
           ============================================ */
        #lightDisplay {
            background-color: #000000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            display: none;
        }

        #lightDisplay .header {
            display: block;
        }

        .back-btn {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .back-btn:hover {
            background-color: #555555;
        }

        .lights-container {
            display: flex;
            gap: 120px;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        /* Position light behind session list when on main page */
        #sessionSelect .lights-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            display: flex;
            pointer-events: none;
        }

        .light {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            font-weight: bold;
            font-size: 14px;
            color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            will-change: filter;
            backface-visibility: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Hide light on session select screen by default */
        #sessionSelect .light {
            display: none;
        }

        /* Show light on session select if they have an active session (went back) */
        #sessionSelect .light.active-session {
            display: flex;
        }

        /* Responsive sizing for different screens */
        @media (min-width: 600px) {
            .light {
                width: 400px;
                height: 400px;
            }
        }

        @media (min-width: 900px) {
            .light {
                width: 600px;
                height: 600px;
            }
        }

        /* Landscape mode adjustments */
        @media (orientation: landscape) {
            .light {
                width: 200px;
                height: 200px;
            }

            .lights-container {
                gap: 60px;
            }
        }

        @media (orientation: landscape) and (min-width: 900px) {
            .light {
                width: 400px;
                height: 400px;
            }

            .lights-container {
                gap: 120px;
            }
        }

        .light.red {
            background-color: transparent;
        }

        /* Off state - green, circle invisible */
        .light.red.off {
            opacity: 0.1;
            filter: none;
        }

        /* White state - yellow alert, blue circle with blue glow */
        .light.red.white {
            opacity: 1;
            filter: drop-shadow(0 0 60px rgba(33, 150, 243, 1)) drop-shadow(0 0 120px rgba(33, 150, 243, 0.8)) drop-shadow(0 0 180px rgba(33, 150, 243, 0.5));
        }

        /* Alert state - pink circle with pink glow */
        .light.red.alert {
            opacity: 1;
            filter: drop-shadow(0 0 60px rgba(255, 20, 147, 1)) drop-shadow(0 0 120px rgba(255, 20, 147, 0.8)) drop-shadow(0 0 180px rgba(255, 20, 147, 0.5));
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            padding: 20px;
        }

        @media (orientation: landscape) {
            .footer {
                display: none;
            }

            .screen {
                padding: 15px;
                justify-content: flex-start;
                padding-top: 60px;
            }

            .session-title {
                font-size: 24px;
                margin-bottom: 8px;
            }

            .session-list {
                max-height: 50vh;
                gap: 10px;
            }

            .session-item {
                padding: 12px;
            }

            .session-item-title {
                font-size: 14px;
                margin-bottom: 4px;
            }

            .session-item-info {
                font-size: 11px;
            }

            .status {
                font-size: 10px;
            }

            .download-section {
                margin-top: 20px;
            }

            .download-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .download-info {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Session Selection Screen -->
        <div class="screen active" id="sessionSelect">
            <div class="session-title">StatusPulse</div>
            <div class="session-subtitle">Real-time feedback for any group</div>
            <div class="session-list" id="sessionList">
                <div class="no-sessions" id="noSessions">Loading displays...</div>
            </div>

            <div class="download-section">
                <div class="download-divider"><span>Control Panel</span></div>
                <a href="https://github.com/sacmusevents/statusPulse/releases/latest/download/app-debug.apk" class="download-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download Android App
                </a>
                <div class="download-info">For signal controllers</div>
            </div>

            <div class="status disconnected" id="status">Connecting...</div>
        </div>

        <!-- Light Display Screen -->
        <div class="screen" id="lightDisplay">
            <div class="header">
                <button class="back-btn" onclick="goBack()">← Back</button>
            </div>
            <div class="lights-container">
                <div class="light red" id="redLight">
                    <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <path d="M50 10 C72.9 10 91 28.1 91 51 C91 73.9 72.9 92 50 92 C27.1 92 9 73.9 9 51 C9 28.1 27.1 10 50 10 Z" fill="white" stroke="white" stroke-width="6"/>
                        <rect x="46" y="25" width="8" height="40" rx="2" fill="#000000"/>
                        <circle cx="50" cy="70" r="5" fill="#000000"/>
                    </svg>
                </div>
            </div>
            <div class="footer">
                <div id="footer-info">Connected to session</div>
                <div id="realtime-status" style="margin-top: 10px; font-size: 11px; color: #888;">Realtime: Connected</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pgipjbsekpwzrjxjytxv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9sD73_OSr4EgV9UFslJykA_bRBS5Kgr';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentSessionId = null;
        let signalChannel = null;

        function formatRelativeTime(dateString) {
            const now = new Date();
            // Normalize timestamp format: replace space with 'T' and fix timezone offset format
            let normalizedDateString = dateString.replace(' ', 'T');
            // Convert +00 to +00:00 for proper ISO 8601 parsing
            normalizedDateString = normalizedDateString.replace(/\+(\d{2})$/, '+$1:00');
            const date = new Date(normalizedDateString);
            const secondsAgo = Math.floor((now - date) / 1000);

            let result;
            if (secondsAgo < 10) result = 'just now';
            else if (secondsAgo < 60) result = 'a few seconds ago';
            else {
                const minutesAgo = Math.floor(secondsAgo / 60);
                if (minutesAgo === 1) result = '1 minute ago';
                else if (minutesAgo < 60) result = `${minutesAgo} mins ago`;
                else {
                    const hoursAgo = Math.floor(minutesAgo / 60);
                    if (hoursAgo === 1) result = 'an hour ago';
                    else if (hoursAgo < 24) result = `${hoursAgo} hours ago`;
                    else {
                        const daysAgo = Math.floor(hoursAgo / 24);
                        if (daysAgo === 1) result = 'yesterday';
                        else if (daysAgo < 7) result = `${daysAgo} days ago`;
                        else if (daysAgo === 7) result = '1 week ago';
                        else {
                            const weeksAgo = Math.floor(daysAgo / 7);
                            if (weeksAgo < 4) result = `${weeksAgo} weeks ago`;
                            else {
                                const monthsAgo = Math.floor(daysAgo / 30);
                                if (monthsAgo === 1) result = '1 month ago';
                                else if (monthsAgo < 12) result = `${monthsAgo} months ago`;
                                else {
                                    const yearsAgo = Math.floor(monthsAgo / 12);
                                    if (yearsAgo === 1) result = '1 year ago';
                                    else result = `${yearsAgo} years ago`;
                                }
                            }
                        }
                    }
                }
            }
            return result;
        }

        async function showSessions() {
            try {
                // Fetch active sessions
                const { data: sessions } = await db.from('sessions')
                    .select('id, title')
                    .eq('status', 'active');

                // Get session IDs for filtering
                const sessionIds = sessions ? sessions.map(s => s.id) : [];

                // Fetch signals for active sessions only
                const { data: signals } = await db.from('signals')
                    .select('session_id, updated_at')
                    .in('session_id', sessionIds);

                // Create a map of session_id -> latest signal update time
                const signalUpdates = {};
                if (signals) {
                    signals.forEach(signal => {
                        signalUpdates[signal.session_id] = signal.updated_at;
                    });
                }

                const list = document.getElementById('sessionList');
                const noSessions = document.getElementById('noSessions');
                const status = document.getElementById('status');

                // Update status to connected
                status.textContent = 'Connected';
                status.className = 'status connected';

                // Remove only session items, not the noSessions element
                const items = list.querySelectorAll('.session-item');
                items.forEach(item => item.remove());

                if (!sessions || sessions.length === 0) {
                    noSessions.style.display = 'block';
                    return;
                }

                noSessions.style.display = 'none';
                sessions.forEach(session => {
                    const div = document.createElement('div');
                    div.className = 'session-item';
                    const title = document.createElement('div');
                    title.className = 'session-item-title';
                    title.textContent = session.title;
                    const info = document.createElement('div');
                    info.className = 'session-item-info';
                    const signalUpdatedAt = signalUpdates[session.id];
                    const formattedTime = signalUpdatedAt ? formatRelativeTime(signalUpdatedAt) : 'never';
                    info.textContent = `Updated: ${formattedTime}`;
                    div.appendChild(title);
                    div.appendChild(info);
                    div.onclick = () => selectSession(session.id, session.title);
                    list.appendChild(div);
                });
            } catch (error) {
                console.error('Error loading sessions:', error);
                const status = document.getElementById('status');
                status.textContent = 'Connection Failed';
                status.className = 'status disconnected';
            }
        }

        async function selectSession(sessionId, title) {
            currentSessionId = sessionId;

            // Move lights container to light display and remove active-session class
            const lightsContainer = document.querySelector('.lights-container');
            const lightDisplay = document.getElementById('lightDisplay');
            const sessionSelect = document.getElementById('sessionSelect');
            if (lightsContainer && lightsContainer.parentElement.id === 'sessionSelect') {
                lightDisplay.appendChild(lightsContainer);
            }
            const redLight = document.getElementById('redLight');
            redLight.classList.remove('active-session');

            document.getElementById('sessionSelect').classList.remove('active');
            document.getElementById('lightDisplay').classList.add('active');

            if (signalChannel) {
                signalChannel.unsubscribe();
            }

            await loadInitialSignal();
            subscribeToSignalChanges();
        }

        async function loadInitialSignal() {
            const { data } = await db.from('signals').select('color').eq('session_id', currentSessionId).single();
            if (data) {
                updateLights(data.color);
            }
        }

        function subscribeToSignalChanges() {
            signalChannel = db.channel(`signals-${currentSessionId}`)
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'signals',
                    filter: `session_id=eq.${currentSessionId}`
                }, (payload) => {
                    updateLights(payload.new.color);
                })
                .subscribe();
        }

        function updateLights(color) {
            const redLight = document.getElementById('redLight');
            const svgPath = redLight.querySelector('path');
            const lightDisplay = document.getElementById('lightDisplay');

            // Reset all states
            redLight.classList.remove('off', 'white', 'alert');

            // Change circle color and glow based on status
            if (color === 'green') {
                // Off state - circle invisible, black background
                redLight.classList.add('off');
                svgPath.setAttribute('fill', 'white');
                svgPath.setAttribute('stroke', 'white');
                lightDisplay.style.backgroundColor = '#000000';
            } else if (color === 'yellow') {
                // Blue circle with blue glow, brighter blue background for contrast
                redLight.classList.add('white');
                svgPath.setAttribute('fill', '#2196F3');
                svgPath.setAttribute('stroke', '#2196F3');
                lightDisplay.style.backgroundColor = '#1a3a5c';
            } else if (color === 'red') {
                // Pink circle with pink glow, brighter maroon background for contrast
                redLight.classList.add('alert');
                svgPath.setAttribute('fill', '#FF1493');
                svgPath.setAttribute('stroke', '#FF1493');
                lightDisplay.style.backgroundColor = '#5c1a38';
            }
        }

        function goBack() {
            if (signalChannel) {
                signalChannel.unsubscribe();
                signalChannel = null;
            }

            // Move lights container to session select and add active-session class
            const lightsContainer = document.querySelector('.lights-container');
            const sessionSelect = document.getElementById('sessionSelect');
            if (lightsContainer && lightsContainer.parentElement.id === 'lightDisplay') {
                sessionSelect.appendChild(lightsContainer);
            }
            const redLight = document.getElementById('redLight');
            redLight.classList.add('active-session');

            currentSessionId = null;
            document.getElementById('lightDisplay').classList.remove('active');
            document.getElementById('sessionSelect').classList.add('active');
            showSessions();
        }

        showSessions();
    </script>
</body>
</html>
