<div class="screen light-display" [ngClass]="currentColor()">
  <div class="header">
    <button class="back-btn" (click)="goBack()">← Back</button>
  </div>

  <div class="lights-container">
    <!-- Signal Light Circle -->
    <div class="light" [ngClass]="currentColor()">
      <svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <path 
          d="M50 10 C72.9 10 91 28.1 91 51 C91 73.9 72.9 92 50 92 C27.1 92 9 73.9 9 51 C9 28.1 27.1 10 50 10 Z" 
          [attr.fill]="currentColor() === 'yellow' ? '#2196F3' : (currentColor() === 'red' ? '#FF1493' : 'white')" 
          [attr.stroke]="currentColor() === 'yellow' ? '#2196F3' : (currentColor() === 'red' ? '#FF1493' : 'white')" 
          stroke-width="6"
        />
        <rect x="46" y="25" width="8" height="40" rx="2" fill="#000000"/>
        <circle cx="50" cy="70" r="5" fill="#000000"/>
      </svg>
    </div>
  </div>

  <div class="footer">
    <div>{{ sessionTitle() }}</div>
    <div class="realtime-status">Status: Active ({{ currentColor() }})</div>
  </div>
</div>
